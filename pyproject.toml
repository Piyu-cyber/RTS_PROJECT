[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rts-project"
version = "1.0.0"
description = "Deadline-Aware Adaptive Inference for Real-Time Vision Systems"
authors = [
    { name = "Piyush Prashant" },
    { name = "Priyanshu Mittal" },
    { name = "Thejas Gowda U M" },
    { name = "Shriyansh S Sahoo" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "scikit-learn>=1.5.0",
    "pyyaml>=6.0",
    "pillow>=10.0.0",
    "tqdm>=4.66.0",
    "timm>=0.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
